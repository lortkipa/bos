---
doAutologin: false
setRootPassword: false
sudoersGroup: sudo
defaultGroups:
    - adm
    - cdrom
    - dip
    - plugdev
    - sudo
    - name: lpadmin
      must_exist: false
      system: true
    - name: netdev
      must_exist: false
      system: true
passwordRequirements:
    minLength: 1
    maxLength: -1
user:
  shell: /bin/bash
  forbidden_names: [ root ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "bos-${cpu}"
