# bOS installer. Module configs not in ./modules come from
# calamares-settings-ubuntu-common (mount, fstab, grubcfg, bootloader, ...).
---
modules-search: [ local ]

instances:
- id: bos_prepare
  module: shellprocess
  config: shellprocess_bos_prepare.conf
- id: bug-LP#1829805
  module: shellprocess
  config: shellprocess_bug-LP#1829805.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - shellprocess@bos_prepare
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@bug-LP#1829805
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - packages
  - umount
- show:
  - finished

branding: bos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
