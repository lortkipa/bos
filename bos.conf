# bOS build configuration. Sourced by build/build.sh; every value can be
# overridden from the environment, e.g. `MIRROR=http://mirror.example/ubuntu make iso`.

: "${BOS_NAME:=bOS}"
: "${BOS_ID:=bos}"
: "${BOS_VERSION:=0.1.0}"
: "${BOS_CODENAME:=aurora}"

# Ubuntu LTS release the system is built on.
: "${SUITE:=noble}"
: "${ARCH:=amd64}"
: "${MIRROR:=http://archive.ubuntu.com/ubuntu}"

# Live session defaults (casper).
: "${LIVE_USER:=bos}"
: "${LIVE_HOSTNAME:=bos}"

# Default locale / timezone baked into the image (the installer lets users change them).
: "${LOCALE:=en_US.UTF-8}"
: "${TIMEZONE:=Etc/UTC}"
