# Boot menu of the live ISO (BIOS and UEFI). @NAME@/@VERSION@ are filled in by build.sh.
set default=0
set timeout=5
set timeout_style=menu

if loadfont /boot/grub/fonts/unicode.pf2; then
  set gfxmode=auto
  insmod all_video
  insmod gfxterm
  terminal_output gfxterm
fi
set color_normal=light-gray/black
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-gray

menuentry "Try or Install @NAME@ @VERSION@" {
  linux /casper/vmlinuz boot=casper quiet loglevel=3 ---
  initrd /casper/initrd
}
menuentry "@NAME@ (safe graphics)" {
  linux /casper/vmlinuz boot=casper quiet loglevel=3 nomodeset ---
  initrd /casper/initrd
}
menuentry "@NAME@ (copy to RAM)" {
  linux /casper/vmlinuz boot=casper quiet loglevel=3 toram ---
  initrd /casper/initrd
}
menuentry "@NAME@ (verbose boot, for debugging)" {
  linux /casper/vmlinuz boot=casper ---
  initrd /casper/initrd
}
if [ "$grub_platform" = "efi" ]; then
  menuentry "UEFI firmware settings" { fwsetup }
fi
menuentry "Reboot" { reboot }
menuentry "Power off" { halt }
